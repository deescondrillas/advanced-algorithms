<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visualización algoritmo — Manacher</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/session.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Visualización algoritmo</h1>
      <p class="subtitle">Palíndromo más largo · Manacher</p>
      <nav><a href="/find.html">Búsqueda · find</a><a href="/" aria-current="page">Manacher</a><a href="/lcs.html">Substring común · lcs</a></nav>
    </header>
    <section class="source-section" aria-label="Archivos del test">
      <div class="chooser">
        <span class="chooser-label">Transmisión</span>
        <div class="chooser-buttons" id="transmissionChoice">
          <button type="button">transmission1.txt</button>
          <button type="button">transmission2.txt</button>
        </div>
      </div>
      <p class="source-note" id="testLabel">—</p>
      <div class="controls">
        <div class="step-actions">
          <button id="nextButton" disabled>Siguiente paso</button>
          <button id="playButton" disabled>Reproducir</button>
          <button id="resetButton" disabled>Reiniciar</button>
        </div>
        <label class="speed-control" for="speed">Velocidad <input type="range" id="speed" min="1" max="10" value="5"><output id="speedValue" for="speed">5</output></label>
      </div>
      <p id="error" role="alert" hidden></p>
    </section>
    <section class="visual-section" aria-label="Arreglo de Manacher">
      <div class="array-heading"><span>Texto transformado · índice 0</span><span id="windowLabel"></span></div>
      <div class="graph-scroll" id="graphScroll"><svg id="graph" role="img" aria-label="Arreglo vacío" hidden></svg></div>
      <dl class="variables">
        <div><dt>actual i</dt><dd id="varI">—</dd></div>
        <div><dt>center</dt><dd id="varCenter">—</dd></div>
        <div><dt>right</dt><dd id="varRight">—</dd></div>
        <div><dt>mirror</dt><dd id="varMirror">—</dd></div>
        <div><dt>matches</dt><dd id="varMatches">—</dd></div>
      </dl>
      <dl class="execution">
        <div><dt>Paso</dt><dd id="stepNumber">—</dd></div>
        <div><dt>Estado</dt><dd id="phase">—</dd></div>
        <div><dt>Comparaciones</dt><dd id="comparisons">—</dd></div>
      </dl>
    </section>
    <section class="result-section" aria-label="Resultado" aria-live="polite">
      <dl class="result">
        <div class="palindrome"><dt id="bestLabel">Palíndromo</dt><dd id="bestText">—</dd></div>
        <div><dt>Longitud</dt><dd id="bestLength">—</dd></div>
        <div><dt>Inicio · base 1</dt><dd id="bestStart">—</dd></div>
        <div><dt>Fin · inclusivo</dt><dd id="bestEnd">—</dd></div>
      </dl>
    </section>
  </main>
</body>
</html>
